[package]
name = "bluecity"
version = "0.3.0"
edition = "2021"
default-run = "bluecity"
[features]
default = ["client"]
client = ["vesper3d/two-d", "vesper3d/gamepad", "dep:macroquad"]
[[bin]]
name = "bluecity"
required-features = ["client"]
[dependencies]
miniz_oxide = "=0.8.9"
vesper3d = { package = "be2", path = "../bluecity-engine", default-features = false }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
macroquad = { version = "=0.4.14", default-features = false, optional = true }
[profile.release]
opt-level = 3
lto = "thin"
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
